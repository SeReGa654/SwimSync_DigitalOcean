name: Security

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL for DAST baseline scan (e.g. https://staging.example.com)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"

jobs:
  dependency-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install python scan tools
        run: pip install pip-audit

      - name: NPM audit (prod deps)
        run: node ops/scripts/audit-prod-deps.mjs

      - name: Pip audit (docx-service)
        run: pip-audit -r docx-service/requirements.txt

  dast-zap-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.target_url }}
          fail_action: true
