services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swimsync-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      BACKEND_PORT: 3001
      FRONTEND_URL: http://localhost:3000
      DOCX_SERVICE_URL: http://docx-service:3012
    ports:
      - "3001:3001"
    depends_on:
      docx-service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: swimsync-frontend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      BACKEND_API_URL: http://backend:3001
      NEXT_PUBLIC_WS_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

  docx-service:
    build:
      context: .
      dockerfile: docx-service/Dockerfile
    container_name: swimsync-docx-service
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DOCX_REDIS_URL: redis://redis:6379
      DOCX_INTERNAL_WORKER: "true"
      CORS_ALLOW_ORIGINS: http://localhost:3000
    ports:
      - "3012:3012"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: swimsync-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: swimsync
      POSTGRES_USER: swimsync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swimsync -d swimsync"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    env_file:
      - .env.docker
    image: redis:7
    container_name: swimsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
